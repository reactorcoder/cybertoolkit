<!doctype html><meta charset="utf-8"><title>Browser Fingerprint Tester</title>
<style>body{font:15px system-ui;max-width:1000px;margin:2em auto;padding:0 1em;background:#111;color:#eee}button{padding:.7em 1em}pre{white-space:pre-wrap;background:#222;padding:1em;border-radius:6px}main{margin-top:1em}section{background:#050807;border-bottom:1px solid #252525;padding:1.1em 1.4em;margin:0;border-left:3px solid #16ff68}section small{display:block;color:#999;letter-spacing:.16em;text-transform:uppercase}section span{color:#eee;font-size:1.1em}section p{color:#999;margin:.45em 0}details{color:#00ff66;margin-top:.6em}details pre{color:#00ff66;background:#000;border-left:3px solid #00ff66} .badge{float:right;border:1px solid #e0b400;color:#e0b400;padding:.25em .5em;font-size:.75em}</style>
<h1>Browser Fingerprint Tester</h1><p>Collected locally in this browser. Nothing is uploaded.</p><button id="run">Run test</button> <button id="pretty">Pretty view</button> <button id="copy">Copy JSON</button><pre id="out">Press Run test.</pre><main id="prettyout"></main>
<script>
const hash=s=>{let h=2166136261;for(let i=0;i<s.length;i++)h=Math.imul(h^s.charCodeAt(i),16777619);return (h>>>0).toString(16).padStart(8,'0')};
function canvas(){let c=document.createElement('canvas'),x=c.getContext('2d');x.textBaseline='top';x.font='16px Arial';x.fillStyle='#f60';x.fillRect(10,10,100,30);x.fillStyle='#069';x.fillText('fingerprint',12,15);return hash(c.toDataURL())}
function webgl(){let c=document.createElement('canvas'),g=c.getContext('webgl')||c.getContext('experimental-webgl');if(!g)return {};let d=g.getExtension('WEBGL_debug_renderer_info');return {vendor:d?g.getParameter(d.UNMASKED_VENDOR_WEBGL):'Unavailable',renderer:d?g.getParameter(d.UNMASKED_RENDERER_WEBGL):'Unavailable',version:g.getParameter(g.VERSION),maxTexture:g.getParameter(g.MAX_TEXTURE_SIZE),extensions:g.getSupportedExtensions()?.length||0}}
let last=null;pretty.onclick=()=>{if(!last)return;prettyout.innerHTML='<h2>Browser fingerprint report</h2><p>Websites can combine screen size, fonts, graphics, time zone, language, and rendering behavior to recognize a browser without cookies. This test runs locally and does not upload or store the report.</p><p><b>Fingerprint ID:</b> '+last.fingerprintId+'</p><p><b>Estimated identifying information:</b> '+last.estimatedBits+' bits. Each bit roughly halves the number of browsers sharing the same signal; this is an educational estimate, not a population measurement.</p><h3>What the browser reveals</h3><p>Stable signals such as User-Agent, canvas, WebGL, fonts, and hardware characteristics are more identifying than changing values such as window size or online status.</p>'+last.attributes.map(a=>{let v=String(a.value), level=(a.label.includes('Canvas')||a.label.includes('GPU')||a.label==='User-Agent'||a.label.includes('fonts'))?'Very revealing':(a.label==='Vendor'||a.label.includes('window')?'Info only':'Revealing');let explanation={ 'User-Agent':'Sent to every site you visit. It names your browser, its version and operating system.','Languages':'Your preferred languages. An unusual combination narrows you down quickly.','Time zone':'Shows the region of the world where you most likely are.','Platform':'The kind of system your browser is running on.','Canvas fingerprint':'A hidden image produces pixels shaped by your GPU, drivers and fonts.','GPU renderer':'Websites can read the graphics renderer exposed by WebGL.','Screen resolution':'Your exact screen resolution. Uncommon sizes make you easier to recognize.'}[a.label]||'A browser detail that may contribute to uniqueness.';return '<section><small>'+a.label+'</small><b class=badge>'+level+'</b><div><span>'+v.replace(/[&<>]/g,'')+'</span></div><p>'+explanation+'</p><details><summary>Technical value</summary><pre>'+v.replace(/[&<>]/g,'')+'</pre></details></section>'}).join('')};copy.onclick=()=>{if(last)navigator.clipboard?.writeText(JSON.stringify(last,null,2))};run.onclick=()=>{let n=navigator,s=screen;let r={generated:new Date().toISOString(),attributes:[
['Browser & Operating System','User-Agent',n.userAgent],['Browser & Operating System','Platform',n.platform],['Browser & Operating System','Languages',n.languages?.join(', ')],['Browser & Operating System','Time zone',Intl.DateTimeFormat().resolvedOptions().timeZone],['Screen & Display','Screen resolution',`${s.width} x ${s.height}`],['Screen & Display','Available area',`${s.availWidth} x ${s.availHeight}`],['Screen & Display','Color depth',`${s.colorDepth}-bit`],['Screen & Display','Pixel ratio',devicePixelRatio],['Hardware','CPU logical cores',n.hardwareConcurrency||'Unavailable'],['Hardware','Device memory (GB, capped)',n.deviceMemory||'Unavailable'],['Hardware','Max touch points',n.maxTouchPoints],['Rendering','Canvas fingerprint',canvas()],['Rendering','WebGL',webgl()],['Privacy Signals','Do Not Track',n.doNotTrack||'Not set'],['Privacy Signals','Cookies enabled',n.cookieEnabled],['Privacy Signals','Automation flag (webdriver)',n.webdriver],['Preferences','Color scheme',matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'],['Capabilities','Storage',`localStorage=${!!window.localStorage}, indexedDB=${!!window.indexedDB}`],['Network','Online status',n.onLine]]};r.fingerprintId=hash(JSON.stringify(r));r.estimatedBits=Math.round(Math.log2(new Set(r.attributes.map(x=>JSON.stringify(x[2]))).size+1)*10)/10;r.attributes=r.attributes.map(x=>({group:x[0],label:x[1],value:x[2]}));last=r;out.textContent=JSON.stringify(r,null,2);pretty.click()};
</script>
